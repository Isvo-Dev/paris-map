<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin"><meta name="color-scheme" content="dark"><title>Paris with Emily</title>
<!-- Paris Bot Mini App (F18). Public code, no data: the places come from data.bin, decrypted with the #k= key.
     Look: "Nuit" (checkin 09 c1), chic, calm, curated (PRODUCT.md). One sans for UI, one serif for names and titles. -->
<script>window.__k=(location.hash.match(/[#&]k=([\w-]+)/)||[])[1]||sessionStorage.getItem('pk')||'';if(window.__k)sessionStorage.setItem('pk',window.__k)</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
:root{
 --bg:#121117;--raise:#1d1c23;--raise2:#28262f;--line:#2e2c35;--ink:#f3f0ea;--sub:#a9a6b0;--faint:#7d7a85;
 --acc:#e5485f;--acc-ink:#fff;--acc-soft:#e5485f26;
 --Food:#ff8a5b;--Nightlife:#a98bff;--Daytime:#6cb4f5;--Suggestions:#e8c46b;
 --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Cormorant Garamond",Georgia,serif;
 --r:12px;--h:var(--tg-viewport-stable-height,100vh);
 --z-map:1;--z-mapui:500;--z-sheet:600;--z-view:700;--z-toast:800;--z-msg:900}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden}
body{font:400 15px/1.45 var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
[hidden]{display:none!important}
.serif{font-family:var(--serif);font-weight:600;letter-spacing:.005em}
.t1{font:600 30px/1.1 var(--serif);margin:0;text-wrap:balance}.t2{font:600 13px/1.3 var(--sans);color:var(--sub);margin:28px 20px 8px}
.sub{color:var(--sub)}.num{font-variant-numeric:tabular-nums}
/* ---------- map ---------- */
#map{position:fixed;inset:0;height:var(--h);background:var(--bg);z-index:var(--z-map)}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.6)}
.leaflet-container{background:var(--bg);font-family:var(--sans)}
.leaflet-control-attribution{font-size:10px;background:#121117cc!important;color:var(--faint)}.leaflet-control-attribution a{color:var(--sub)}.leaflet-top{top:120px}
.top{position:fixed;top:0;left:0;right:0;z-index:var(--z-mapui);padding:10px 12px 0;pointer-events:none}.top>*{pointer-events:auto}
.search{display:flex;align-items:center;gap:8px;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:0 4px 0 16px;height:48px}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:16px;min-width:0}.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{display:none}
.search .x{border:0;background:none;color:var(--sub);width:44px;height:44px;border-radius:50%;display:none}.search.has .x{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px -12px 0;padding:0 12px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.chip .d{width:8px;height:8px;border-radius:50%}
select.chip{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat}
.pin{width:18px;height:18px;border-radius:50%;border:2px solid #121117;box-shadow:0 0 0 1.5px #ffffff55}
.pin.sel{width:26px;height:26px;border-width:3px;box-shadow:0 0 0 2px var(--ink)}
.me{width:16px;height:16px;border-radius:50%;background:var(--acc);border:3px solid var(--ink);box-shadow:0 0 0 8px var(--acc-soft)}
.fab{position:fixed;right:12px;z-index:var(--z-mapui);width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--raise);color:var(--ink);font-size:20px;display:grid;place-items:center}
.fab.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-sheet);height:var(--peek,190px);background:var(--bg);border-top:1px solid var(--line);border-radius:20px 20px 0 0;display:flex;flex-direction:column;transition:height .22s cubic-bezier(.22,1,.36,1)}
.sheet.drag{transition:none}
.grab{padding:10px 0 6px;touch-action:none;cursor:grab}.grab i{display:block;width:40px;height:4px;border-radius:2px;background:var(--raise2);margin:0 auto}
.hd{display:flex;align-items:center;gap:8px;padding:0 20px 6px;min-height:36px}.hd .cnt{flex:1;color:var(--sub);font-size:13px}
.textbtn{border:0;background:none;color:var(--ink);font-weight:500;font-size:14px;min-height:44px;padding:0 4px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.body{flex:1;overflow-y:auto;padding:0 20px calc(20px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.card{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;min-height:64px}.card:first-child{border-top:0}
.card .b{flex:1;min-width:0}.card .nm{font:600 19px/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card img,.card .ni{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:var(--raise)}
.f{color:var(--sub);font-size:13px;margin-top:2px;display:flex;align-items:center;gap:6px}.f .d{width:7px;height:7px;border-radius:50%;flex:none;align-self:flex-start;margin-top:6px}
.card .f{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.card .f .d{display:inline-block;vertical-align:middle;margin:0 6px 2px 0}
.min{flex:none;width:44px;text-align:center}.min b{display:block;font:600 20px/1 var(--sans);font-variant-numeric:tabular-nums}.min small{color:var(--sub);font-size:11px}
.det h2{font:600 26px/1.15 var(--serif);margin:2px 0 4px;text-wrap:balance}
.det .v{margin:12px 0 0}.det ul{margin:8px 0 0;padding-left:18px;color:var(--sub);font-size:14px}.det ul li{margin:3px 0}
.acts{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--raise);font-weight:500;font-size:14px}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn[disabled]{color:var(--faint);background:transparent}
.src{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.mv{margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}.mv p{margin:0 0 8px;font-size:13px;color:var(--sub)}
.ph{display:flex;gap:6px;overflow-x:auto;margin:14px -20px 0;padding:0 20px;scrollbar-width:none}.ph img{height:110px;width:150px;object-fit:cover;border-radius:10px;flex:none;background:var(--raise)}
.msg{position:fixed;inset:0;display:grid;place-items:center;padding:32px;text-align:center;color:var(--sub);z-index:var(--z-msg);background:var(--bg)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--peek,190px) + 12px);z-index:var(--z-toast);background:var(--raise2);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
body:not([data-v=map]) .toast{bottom:24px}
.empty{color:var(--sub);padding:20px 0;text-align:center}
@media(prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
/* ---------- Emily's views: they cover the map, which stays laid out below ---------- */
.view{position:fixed;inset:0;z-index:var(--z-view);overflow-y:auto;display:none;background:var(--bg);padding-bottom:calc(28px + env(safe-area-inset-bottom))}
body[data-v=home] #home,body[data-v=review] #review,body[data-v=info] #info,body[data-v=reels] #reels,body[data-v=top] #top,body[data-v=recs] #recs{display:block}
.pad{padding:0 20px}
.hero{position:relative;height:300px;background:var(--raise)}.hero img{width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block}
.hero .g{position:absolute;left:0;right:0;bottom:0;padding:70px 20px 16px;background:linear-gradient(transparent,var(--bg) 78%)}.hero .g p{margin:4px 0 0;color:var(--sub)}
.rv{display:flex;align-items:center;gap:14px;width:calc(100% - 40px);margin:14px 20px 0;padding:14px 16px;border:0;border-radius:var(--r);background:var(--acc);color:var(--acc-ink);text-align:left;min-height:64px}

.rv.zero{background:var(--raise);color:var(--ink)}.rv.zero b{color:var(--sub)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 20px 0}
.pair button{border:1px solid var(--line);border-radius:var(--r);background:var(--raise);padding:14px;min-height:80px;text-align:left;font-weight:600;font-size:16px}
.pair small{display:block;font-weight:400;color:var(--sub);font-size:13px;margin-top:3px}
.grp{margin:0 20px;border-radius:var(--r);background:var(--raise);overflow:hidden}
.grp>button,.grp>div{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.grp>:first-child{border-top:0}.grp .tx{flex:1;min-width:0}.grp small{display:block;color:var(--sub);font-size:13px}.grp .ch{color:var(--faint)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.foot{display:flex;justify-content:center;gap:4px;margin:22px 0 0}.foot button{border:0;background:none;color:var(--sub);min-height:44px;padding:0 12px;font-size:14px}
/* review */
.qhead{display:flex;align-items:flex-end;gap:12px;padding:16px 20px 0}.helper{width:76px;height:76px;object-fit:contain;flex:none}
.qmeta{flex:1}.qprog{display:flex;justify-content:space-between;color:var(--sub);font-size:13px}
.qbar{height:4px;border-radius:2px;background:var(--raise2);margin:8px 0 2px}.qbar i{display:block;height:100%;background:var(--acc);border-radius:2px;width:0}
.qcard{margin:16px 20px 0}.qcard .from{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--sub);font-size:13px}
.qcard h3{font:600 30px/1.1 var(--serif);margin:8px 0 4px;text-wrap:balance}.qcard .why{color:var(--sub);font-size:14px}
.at{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--acc-soft);color:var(--ink);font-size:12px;font-weight:500}
.opt{border:1px solid var(--line);border-radius:var(--r);background:var(--raise);padding:12px;margin:12px 0 0}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.opt .ph{margin:0 0 10px;padding:0}.opt .ph img{height:84px;width:112px}
.opt .row{display:flex;gap:10px;align-items:center}.opt .t{flex:1;min-width:0}.opt .nm{font:600 19px/1.2 var(--serif)}.opt .ad{color:var(--sub);font-size:13px;margin-top:2px}
.opt .lk{margin-top:6px}
.ok{min-height:44px;padding:0 14px;border-radius:var(--r);border:1px solid var(--ink);background:transparent;font-weight:600;font-size:14px;flex:none}
.opt.on .ok{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.qbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 20px 0}.qbtns button{min-height:48px;border-radius:var(--r);border:1px solid var(--line);background:var(--raise);font-weight:500}
.qbtns button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.qbtns button[disabled]{color:var(--faint);background:transparent}
.sendq{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));display:block;width:calc(100% - 40px);margin:18px 20px 0;min-height:54px;border:0;border-radius:var(--r);background:var(--acc);color:var(--acc-ink);font-weight:600;font-size:16px;box-shadow:0 8px 24px #000a}
.sendq:disabled{background:var(--raise2);color:var(--sub);box-shadow:none}
.done{text-align:center;padding:24px 20px;color:var(--sub)}.done img{width:180px;height:180px;object-fit:contain;display:block;margin:0 auto 8px}
.lnk{border:0;background:none;color:var(--ink);min-height:44px;padding:0;font-weight:500;font-size:13.5px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint);white-space:nowrap}
/* reels and most mentioned */
.ttl{padding:20px 20px 6px}.ttl p{margin:6px 0 0;color:var(--sub);font-size:14px}
.rl{margin:14px 20px 0;border-radius:var(--r);background:var(--raise);overflow:hidden}
.rl .rtop{display:flex;gap:14px;padding:12px}.rl .th{width:60px;height:106px;border-radius:8px;object-fit:cover;flex:none;background:var(--raise2)}
.rl .meta{flex:1;min-width:0}.rl .meta .d{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:13px}
.rl .meta p{margin:2px 0 0;font-size:15px;line-height:1.4}
.pr{display:flex;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;min-height:64px}
.pr img,.pr .ni{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none;background:var(--raise2)}
.pr .tx{flex:1;min-width:0}.pr .nm{font:600 18px/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl .more,.rl .q{display:block;width:100%;min-height:48px;padding:0 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:14px;color:var(--sub)}
.rl .q{color:var(--ink);font-weight:500}.rl .q b{color:var(--acc)}
.rl .none{padding:0 12px 12px;color:var(--sub);font-size:13px}
.mm{display:flex;gap:14px;padding:14px 20px;border-top:1px solid var(--line);cursor:pointer}.mm:first-of-type{border-top:0}
.mm img,.mm .ni{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:var(--raise)}
.mm .tx{flex:1;min-width:0}.mm .nm{font:600 21px/1.15 var(--serif)}
.mm .n{flex:none;text-align:center;min-width:40px}.mm .n b{display:block;font:600 22px/1 var(--sans);font-variant-numeric:tabular-nums;color:var(--acc)}.mm .n small{color:var(--sub);font-size:11.5px}
.rc{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.rc button{display:block;text-align:left;min-height:40px;padding:8px 12px;border:0;border-radius:10px;background:var(--raise);font-size:13px;line-height:1.35;color:var(--ink)}
.rc button span{color:var(--sub)}.rc button{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* Emily's recommendations */
.rbar{position:sticky;top:0;z-index:2;background:var(--bg);padding:6px 20px 0}
.rbar .chips{margin:10px -20px 0;padding:0 20px 10px}
.rec{margin:4px 20px 16px;border-radius:var(--r);background:var(--raise);overflow:hidden}
.rec .ph{margin:0;padding:12px 12px 0}.rec .ph img{height:120px;width:164px}
.rec .bd{padding:12px 14px 14px}.rec .nm{font:600 23px/1.15 var(--serif);text-wrap:balance}
.rec .v{margin:8px 0 0}.rec .why{margin:6px 0 0;color:var(--sub);font-size:14px}.rec .acts{margin-top:12px}
/* info */
.infoart{display:block;width:150px;height:150px;object-fit:contain;margin:16px auto 0}
.info{border-radius:var(--r);background:var(--raise);padding:4px 16px}
.info div{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;border-top:1px solid var(--line)}.info div:first-child{border-top:0}
.info span{color:var(--sub)}.info b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.helptext{max-width:65ch}.helptext p{margin:0 0 12px;line-height:1.55}.helptext code{font-family:var(--sans);font-weight:600;color:var(--ink)}
.note{color:var(--sub);font-size:14px;margin:12px 0 0}
</style></head><body>
<div id="map"></div>
<div class="top">
 <div class="search" id="sbox"><input id="q" type="search" placeholder="Search places, types, vibes" autocomplete="off" aria-label="Search places"><button class="x" id="qx" aria-label="Clear search">✕</button></div>
 <div class="chips" id="chips"></div>
</div>
<button class="fab" id="near" aria-label="Near me">◎</button>
<div class="sheet" id="sheet"><div class="grab" id="grab"><i></i></div><div class="hd" id="hd"></div><div class="body" id="body"></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="msg" id="msg">Opening…</div>
<section class="view" id="home">
 <div class="hero"><img id="skyart" alt="Emily on a Paris rooftop at dusk" hidden><div class="g"><h1 class="t1" id="hello"></h1><p>Your Paris, saved and sorted.</p></div></div>
 <button class="rv" id="rvb"></button>
 <div class="pair"><button data-go="near">Near me<small>Saved places by walking minutes</small></button><button data-go="map">Map<small>Filter by list, area, price</small></button></div>
 <h2 class="t2">Browse</h2>
 <div class="grp"><button data-go="reels"><span class="tx">Our reels<small id="nreels"></small></span><span class="ch">›</span></button><button data-go="top"><span class="tx">Most mentioned<small>Places several reels agree on</small></span><span class="ch">›</span></button><button data-go="recs"><span class="tx">Emily's recommendations<small id="nrecs"></small></span><span class="ch">›</span></button></div>
 <h2 class="t2">Our Google Maps lists</h2>
 <div class="grp" id="lists"></div>
 <div class="foot"><button data-go="status">Status</button><button data-go="pending">Pending</button><button data-go="help">Help</button></div>
</section>

 <div class="rbar"><div class="search" id="rsbox"><input id="rq" type="search" placeholder="Search Emily's picks" autocomplete="off" aria-label="Search Emily's recommendations"><button class="x" id="rqx" aria-label="Clear search">✕</button></div><div class="chips" id="rchips"></div></div>
 <div id="recbody"></div>
</section>
<section class="view" id="info"><div class="pad" id="infobody"></div></section>

<script>
'use strict';
const tg=window.Telegram&&Telegram.WebApp, $=id=>document.getElementById(id);
const LISTS=['Food','Nightlife','Daytime','Suggestions'], NAME={Suggestions:"Emily's ideas"};
const CODE={Food:'F',Nightlife:'N',Daytime:'D',Suggestions:'S'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=null, P=[], map, marks={}, me=null, meLayer=null, sel=null;
const F={c:'',a:'',p:'',o:'',q:'',w:''};
const SEL=new Set();  // list chips: any combination, none = all (owner, 2026-10-19)
let ideas=!!localStorage.getItem('pb_ideas');  // Emily's suggestions: hidden until asked for (owner, 2026-10-19)
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#121117');tg.setBackgroundColor('#121117')}catch(e){}}

async function load(){
  if(!window.__k)throw new Error('Open the app from the 🗺 Paris map button in your chat with Emily.');
  const r=await fetch('data.bin',{cache:'no-store'});if(!r.ok)throw new Error('The data is not there yet. Try again in a minute.');
  const raw=Uint8Array.from(atob((await r.text()).trim()),c=>c.charCodeAt(0));
  const kb=Uint8Array.from(atob(window.__k.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-window.__k.length%4)%4)),c=>c.charCodeAt(0));
  const key=await crypto.subtle.importKey('raw',kb,'AES-GCM',false,['decrypt']);
  try{return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12))))}

    ${p.vibe?`<p class="v">${esc(p.vibe)}</p>`:''}${p.why&&p.why!==p.vibe?`<p class="why">Why I picked it: ${esc(p.why)}</p>`:''}
    <div class="acts"><button class="btn p" data-link="${esc(p.maps)}">Open in Google Maps</button><button class="btn" data-place="${esc(p.id)}">On the map</button></div></div></div>`).join('')
    ||'<div class="empty">Nothing matches. <button class="textbtn" id="rclear">Clear filters</button></div>';
  if($('rclear'))$('rclear').onclick=()=>{RF.c.clear();Object.assign(RF,{a:'',p:'',o:'r',q:''});$('rq').value='';$('rsbox').classList.remove('has');recsPage(true)};
  if(!keepView)go('recs');
}
$('rchips').addEventListener('click',e=>{const b=e.target.closest('[data-rc]');if(b){RF.c.has(b.dataset.rc)?RF.c.delete(b.dataset.rc):RF.c.add(b.dataset.rc);recsPage(true)}});
$('rchips').addEventListener('change',e=>{const s=e.target.closest('[data-rf]');if(s){RF[s.dataset.rf]=s.value||(s.dataset.rf==='o'?'r':'');recsPage(true)}});
$('rq').addEventListener('input',e=>{RF.q=e.target.value;$('rsbox').classList.toggle('has',!!RF.q);recsPage(true)});
$('rqx').onclick=()=>{$('rq').value='';RF.q='';$('rsbox').classList.remove('has');recsPage(true)};
function info(kind){
  const S=D.status||{},c=D.counts||{},j=S.jobs||{};let h='';
  if(kind==='status')h=`<img class="infoart" src="art/emily-pinned.png" alt="" onerror="this.remove()"><h1 class="t1" style="margin:12px 0 14px">Status</h1><div class="info"><div><span>Reels done</span><b>${j.done||0}</b></div><div><span>Reels in the queue</span><b>${(j.queued||0)+(j.working||0)+(j.understood||0)}</b></div>
    ${LISTS.filter(l=>ideas||l!=='Suggestions').map(l=>`<div><span>${NAME[l]||l}</span><b>${c[l]||0}</b></div>`).join('')}<div><span>Places to confirm</span><b>${Q.length}</b></div>
    <div><span>Our hotel</span><b>${esc(S.hotel||'Not set yet')}</b></div><div><span>Updated</span><b>${esc((D.updated||'').replace('T',' ').slice(0,16))}</b></div></div>`;
  if(kind==='pending'){const pd=D.pending||[];h=`<h1 class="t1" style="margin:22px 0 14px">Not on Google Maps yet</h1>`+(pd.length?`<div class="info">${pd.map(p=>`<div><span>${esc(p.name)}</span>${p.maps?`<button class="lnk" data-link="${esc(p.maps)}">Maps ↗</button>`:''}</div>`).join('')}</div><p class="note">I retry these by myself; nothing to do.</p>`:`<p class="note">Everything is on Google Maps.</p>`)}
  if(kind==='help')h=`<img class="infoart" src="art/emily.png" alt="Emily" onerror="this.remove()"><h1 class="t1" style="margin:12px 0 14px">What I can do</h1><div class="helptext"><p>Send me a reel, a TikTok or a YouTube Short in the chat. I find the places, pin them on our Google Maps lists and react on your message: 👍 pinned, 🤔 a place to confirm here, 🤷 no Paris place.</p>
    <p>Here: confirm places one at a time, browse our reels and the places they mention most, and find what is near you on the map. Combine the list chips, for example Food and Nightlife.</p>
    <p>In the chat, write to me like to a friend who knows Paris: "brunch in the Marais?", "plan Saturday", "more wine bars like that one". Commands: <code>/near</code> · <code>/list</code> · <code>/status</code> · <code>/pending</code> · <code>/hotel</code> · <code>/clear</code> · <code>/help</code></p></div>`;
  $('infobody').innerHTML=h;go('info');
}
document.addEventListener('click',e=>{
  const l=e.target.closest('[data-link]');if(l&&l.dataset.link){e.preventDefault();e.stopPropagation();return out(l.dataset.link)}
  const g=e.target.closest('[data-go]');if(g){const v=g.dataset.go;
    if(v==='map'){go('map');snap('peek')}else if(v==='near'){go('map');if(!me)nearMe()}else if(v==='reels')reelsPage();else if(v==='top')topPage();else if(v==='recs')recsPage();else info(v);return}
  const mr=e.target.closest('[data-more]');if(mr){reelsOpen.add(+mr.dataset.more);return reelsPage(true)}
  const rq=e.target.closest('[data-q]');if(rq){qi=Math.max(0,Q.findIndex(q=>q.id===+rq.dataset.q));go('review');return drawQ()}
  const rp=e.target.closest('[data-place]');if(rp){const p=P.find(x=>x.id===rp.dataset.place);if(p){go('map');detail(p)}return}
  const k=e.target.closest('[data-pick]');if(k)return pick(+k.dataset.pick);
},true);
$('rvb').onclick=()=>{if(Q.length){go('review');drawQ()}};
$('qnone').onclick=()=>pick('x');$('qall').onclick=()=>pick('a');$('qprev').onclick=()=>{qi--;drawQ()};$('qskip').onclick=()=>{qi++;drawQ()};
$('sendq').onclick=sendAnswers;
main();
</script></body></html>
