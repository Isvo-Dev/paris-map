<script>
'use strict';
const tg=window.Telegram&&Telegram.WebApp, $=id=>document.getElementById(id);
const ICON={Food:'🍽️',Nightlife:'🍸',Daytime:'🏛️',Suggestions:'✨'}, LISTS=['Food','Nightlife','Daytime','Suggestions'];
const CODE={Food:'F',Nightlife:'N',Daytime:'D',Suggestions:'S'}, NAME={Suggestions:'Ideas'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=null, P=[], map, marks={}, me=null, meLayer=null, sel=null;
const F={l:'',c:'',a:'',p:'',o:'',q:'',w:''};
let ideas=!!localStorage.getItem('pb_ideas');  // Emily's suggestions: hidden until asked for (owner, 2026-10-19)
if(tg){tg.ready();tg.expand();if(tg.colorScheme==='dark')document.documentElement.classList.add('dark');tg.onEvent('themeChanged',()=>document.documentElement.classList.toggle('dark',tg.colorScheme==='dark'))}
else if(matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.classList.add('dark');

async function load(){
  if(!window.__k)throw new Error('Open the map from the 🗺 Paris map button in your chat with Paris Bot.');
  const r=await fetch('data.bin',{cache:'no-store'});if(!r.ok)throw new Error('The map data is not there yet. Try again in a minute.');
  const raw=Uint8Array.from(atob((await r.text()).trim()),c=>c.charCodeAt(0));
  const kb=Uint8Array.from(atob(window.__k.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-window.__k.length%4)%4)),c=>c.charCodeAt(0));
  const key=await crypto.subtle.importKey('raw',kb,'AES-GCM',false,['decrypt']);
  try{return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12))))}
